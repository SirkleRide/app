<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Sirkle Driver</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css"><script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--fg:#000;--mut:#6b6b6b;--line:#e4e4e4;--card:#f4f4f4}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{font-family:Montserrat,system-ui,sans-serif;background:#d9d6d0;color:var(--fg);display:flex;justify-content:center;align-items:center}
#app{width:100%;height:100%;max-width:420px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:500px){#app{height:min(860px,96%);border-radius:36px;box-shadow:0 20px 60px #0005}}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}button:focus-visible,input:focus-visible{outline:3px solid #888;outline-offset:2px}
.btn{width:100%;padding:15px;border-radius:14px;background:var(--fg);color:var(--bg);font-weight:600}.btn.ghost{background:var(--card);color:var(--fg)}
input{font:inherit;width:100%;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}
h2{font-size:22px}.mut{color:var(--mut);font-size:13px}.err{color:#c0392b;font-size:13px;min-height:16px}
.pad{padding:24px;display:flex;flex-direction:column;gap:12px;flex:1;overflow:auto}
.top{display:flex;align-items:center;gap:10px;padding:10px 16px}.top img{width:34px;border-radius:8px}.top b{letter-spacing:.12em}
.pill{margin-left:auto;padding:8px 14px;border-radius:20px;background:var(--card);font-weight:600;font-size:13px}.pill.on{background:var(--fg);color:var(--bg)}
#mp{flex:1;min-height:160px;background:#ececec}.leaflet-container{font-family:inherit}
.sheet{padding:16px 20px 20px;border-radius:24px 24px 0 0;box-shadow:0 -8px 30px #0002;display:flex;flex-direction:column;gap:10px;max-height:58%;overflow:auto;background:var(--bg)}
.req{background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.car{width:28px;height:28px;border-radius:50%;background:#fff;color:#000;border:3px solid #000;display:grid;place-items:center;font-weight:700;font-size:13px}
</style></head><body><main id="app" aria-live="polite"></main>

async function api(p,m,b){const r=await fetch("/api"+p,{method:m||"GET",headers:{"Content-Type":"application/json",...(TOK?{Authorization:"Bearer "+TOK}:{})},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||"Something went wrong");e.status=r.status;throw e}return j}

function login(){clearInterval(tm);LM=null;$.innerHTML=`${hdr("")}<div class="pad"><h2>${S.reg?"Drive with Sirkle":"Driver log in"}</h2>

<input id="em" type="email" placeholder="Email" autocomplete="email"><input id="pw" type="password" placeholder="Password (min 8 characters)" autocomplete="${S.reg?"new-password":"current-password"}">
<div class="err" role="alert">${S.err}</div><button class="btn" onclick="auth()">${S.reg?"Sign up":"Log in"}</button>
<button class="btn ghost" onclick="S.reg=!S.reg;S.err='';login()">${S.reg?"I have an account":"New driver? Sign up"}</button></div>`}
async function auth(){const g=i=>($.querySelector("#"+i)||{}).value||"";
try{const r=await api(S.reg?"/register":"/login","POST",{name:g("nm"),vehicle:g("vh"),plate:g("pl"),email:g("em"),password:g("pw"),role:"driver"});
if(r.user.role!="driver"){S.err="This is a rider account. Use the Sirkle rider app.";return login()}setTok(r.token);S.err="";shell()}catch(e){S.err=e.message;login()}}
function logout(){setTok(null);clearInterval(tm);if(wid!=null)navigator.geolocation.clearWatch(wid);wid=null;login()}
function shell(){$.innerHTML=`${hdr('<button class="pill" id="pill" onclick="tog()">○ Offline</button><button class="pill" style="margin-left:6px" onclick="logout()">Sign out</button>')}<div id="mp"></div><div class="sheet" id="sh"></div>`;
LM=L.map("mp",{zoomControl:false}).setView([-33.9608,22.4617],13);L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(LM);LL=L.layerGroup().addTo(LM);
clearInterval(tm);poll();tm=setInterval(poll,3000)}
async function poll(){try{S.st=await api("/driver/state");view()}catch(e){if(e.status==401)logout()}}
const km=(a,b)=>{const r=x=>x*Math.PI/180,d=r(b[0]-a[0]),e=r(b[1]-a[1]);return 12742*Math.asin(Math.sqrt(Math.sin(d/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(e/2)**2))};
const NEXT={accepted:["arrived","I’ve arrived at pickup"],arrived:["ontrip","Start trip"],ontrip:["completed","Complete trip"]};
function view(){const s=S.st,pill=document.getElementById("pill"),sh=document.getElementById("sh");if(!sh)return;pill.textContent=s.online?"● Online":"○ Offline";pill.className="pill"+(s.online?" on":"");
let h="";const r=s.ride;
if(r){const H={accepted:"Head to pickup",arrived:"Waiting for "+r.riderName,ontrip:"Trip in progress"}[r.status];
 h=`<h2>${H}</h2><div class="req"><b>${r.riderName}</b><span class="mut">Pickup: ${r.pick[0]}<br>Drop-off: ${r.drop[0]}</span><div class="row"><b>R${r.driverPay.toFixed(2)} <span class="mut">you earn (fare R${r.fare})</span></b><span class="mut">${r.km.toFixed(1)} km · ${r.pay}</span></div>${r.pay=="Cash"?`<span class="mut">Collect R${r.fare} cash. Sirkle’s 10% fee is R${r.commission.toFixed(2)}.</span>`:""}</div><button class="btn" onclick="adv('${r.id}','${NEXT[r.status][0]}')">${NEXT[r.status][1]}</button>`}
else if(!s.online)h=`<h2>You’re offline</h2><p class="mut">Go online to start receiving ride requests. Location sharing starts when you go online.</p>`;
else h=s.requests.length?`<h2>Ride requests</h2>`+s.requests.map(q=>`<div class="req"><div class="row"><b>R${q.driverPay.toFixed(2)} <span class="mut">you earn (fare R${q.fare})</span></b><span class="mut">${q.km.toFixed(1)} km trip${S.me?" · "+km(S.me,[q.pick[1],q.pick[2]]).toFixed(1)+" km to pickup":""}</span></div><span>${q.pick[0]} → ${q.drop[0]}</span><button class="btn" onclick="acc('${q.id}')">Accept</button></div>`).join(""):`<h2>Waiting for requests…</h2><p class="mut">Stay on this screen. New rides appear here.</p>`;
sh.innerHTML=(S.msg?`<p role="status"><b>${S.msg}</b></p>`:"")+h+`<p class="mut">Today’s earnings: <b>R${s.earnings.toFixed(2)}</b></p>`;map()}
function map(){const s=S.st,r=s.ride;LL.clearLayers();
if(S.me)L.marker(S.me,{icon:L.divIcon({className:"",html:'<div class="car">S</div>',iconSize:[28,28]})}).addTo(LL);
let pts=S.me?[S.me]:[];if(r){const a=[r.pick[1],r.pick[2]],b=[r.drop[1],r.drop[2]];pts.push(a,b);if(r.route)L.polyline(r.route,{color:"#000",weight:5}).addTo(LL);
 L.circleMarker(a,{radius:8,color:"#fff",weight:3,fillColor:"#000",fillOpacity:1}).addTo(LL);L.marker(b,{icon:L.divIcon({className:"",html:'<div style="width:16px;height:16px;background:#000;border:3px solid #fff"></div>',iconSize:[16,16]})}).addTo(LL)}
const k=(r?r.id+r.status:"x")+(S.me?1:0);if(k!=key&&pts.length){key=k;pts.length>1?LM.fitBounds(L.latLngBounds(pts),{padding:[40,40]}):LM.setView(pts[0],14)}}
async function tog(){const on=!S.st.online;try{await api("/driver/online","POST",{online:on})}catch(e){return}
if(on&&navigator.geolocation&&wid==null)wid=navigator.geolocation.watchPosition(p=>{S.me=[p.coords.latitude,p.coords.longitude];if(Date.now()-lastPost>4000){lastPost=Date.now();api("/driver/loc","POST",{lat:S.me[0],lon:S.me[1]}).catch(()=>{})}},()=>{S.msg="Location unavailable. Riders can’t see your car without it.";view()},{enableHighAccuracy:true});
if(!on&&wid!=null){navigator.geolocation.clearWatch(wid);wid=null}S.msg="";poll()}
async function acc(id){try{await api("/rides/"+id+"/accept","POST");S.msg=""}catch(e){S.msg=e.message}poll()}
async function adv(id,st){try{await api("/rides/"+id+"/status","POST",{status:st});S.msg=st=="completed"?"Trip complete. Nice work!":""}catch(e){S.msg=e.message}poll()}
Object.assign(window,{auth,login,logout,tog,acc,adv,S});
(async()=>{if(TOK){try{const u=(await api("/me")).user;if(u.role=="driver")return shell()}catch(e){}setTok(null)}login()})();
})();</script></body></html>
